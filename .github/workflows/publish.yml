name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/

      - name: Clone Vencord
        run: |
          git clone --depth 1 https://github.com/Vendicated/Vencord.git vencord
          cd vencord
          corepack enable
          pnpm install --frozen-lockfile

      - name: Get short commit hash
        id: hash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy plugin
        run: |
          cp -r src/plugins/supportka vencord/src/plugins/supportka
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/const PLUGIN_VERSION = .*/const PLUGIN_VERSION = \"$version\";/" vencord/src/plugins/supportka/index.tsx

      - name: Build standalone
        env:
          VENCORD_REMOTE: Akimuska/Vencord-Supportka
          VENCORD_HASH: ${{ steps.hash.outputs.short }}
        run: |
          cd vencord
          pnpm build --standalone

      - name: Create ZIP archive
        run: |
          mkdir -p "/tmp/supportka/supportka-${{ github.ref_name }}/Vencord/dist"
          cp vencord/dist/renderer.js vencord/dist/renderer.css \
             vencord/dist/preload.js vencord/dist/patcher.js \
              "/tmp/supportka/supportka-${{ github.ref_name }}/Vencord/dist/"
          cp drop-in.bat "/tmp/supportka/supportka-${{ github.ref_name }}/"
          cd /tmp/supportka
          zip -r "supportka-${{ github.ref_name }}.zip" "supportka-${{ github.ref_name }}"
          mv "supportka-${{ github.ref_name }}.zip" "$GITHUB_WORKSPACE"

      - name: Publish to GitHub Packages
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8').replace(/^\\uFEFF/,''));p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'')+'.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm publish || echo "npm publish skipped (version may already exist or package publishing is unavailable)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} ${{ steps.hash.outputs.short }}"
          files: |
            supportka-${{ github.ref_name }}.zip
